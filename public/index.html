<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff7ed">
  <meta name="description" content="App de Fidelización NIJI Perú - Tarjeta de Sellos Digitales y Ruleta Spin-to-Win">
  <title>NIJI Perú Club | Tarjeta de Sellos & Premios</title>
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/img/niji-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/niji-logo.png">

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=4.0">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            niji: {
              red: '#ff4d5a',
              'red-pastel': '#ffe4e6',
              orange: '#ff7e29',
              'orange-pastel': '#ffedd5',
              yellow: '#f59e0b',
              'yellow-pastel': '#fef3c7',
              teal: '#0d9488',
              'teal-pastel': '#ccfbf1',
              pink: '#f43f5e',
              'pink-pastel': '#ffe4e6',
              bg: '#f8fafc',
              surface: '#ffffff'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="landing-mode">

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Barra de Navegación Superior (Esquina Superior Derecha: Botón Opcional de Fidelización) -->
  <header class="w-full bg-white/95 backdrop-blur border-b border-slate-200/80 text-xs py-2.5 px-4 sm:px-6 flex items-center justify-between sticky top-0 z-50 shadow-sm">
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="navigateTo('#inicio')">
      <img src="/img/niji-logo.png" alt="NIJI Logo" class="w-8 h-8 object-contain logo-sticker" />
      <div class="flex items-center gap-1.5">
        <span class="brand-logo-title text-lg font-black">
          <span class="text-[#ff4d5a]">N</span><span class="text-[#ff7e29]">I</span><span class="text-[#f59e0b]">J</span><span class="text-[#0d9488]">I</span>
        </span>
        <span class="font-black text-slate-800 tracking-wide text-xs">PERÚ</span>
      </div>
      <span class="bg-orange-50 text-orange-600 border border-orange-200 px-2 py-0.5 rounded-full text-[10px] font-bold hidden md:inline ml-1">Postres &amp; Raspadillas</span>
    </div>

    <div class="flex items-center gap-2.5">
      <!-- Toggle de Simulador Móvil (visible en vistas App) -->
      <button id="toggle-frame-btn" class="hidden text-slate-600 hover:text-slate-900 flex items-center gap-1 transition px-2.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold" title="Alternar marco de teléfono móvil">
        <span id="frame-btn-icon">📱</span>
        <span id="frame-btn-text" class="hidden sm:inline">Modo Móvil</span>
      </button>

      <!-- Usuario Logueado / Logout -->
      <div id="nav-user-info" class="hidden flex items-center gap-2 pr-2 border-r border-slate-200">
        <span id="nav-username" class="font-bold text-orange-600 text-xs cursor-pointer hover:underline" onclick="openLoyaltyApp()"></span>
        <button onclick="logout()" class="text-slate-400 hover:text-rose-600 transition" title="Cerrar Sesión">
          <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>

      <!-- Botón Opcional de AppWeb de Fidelización en la esquina superior derecha -->
      <button id="header-loyalty-btn" onclick="openLoyaltyApp()" class="bg-gradient-to-r from-[#ff4d5a] via-[#ff7e29] to-[#f59e0b] text-white px-3.5 py-1.5 rounded-full text-xs font-black shadow-sm hover:shadow-md hover:brightness-105 transition flex items-center gap-1.5 cursor-pointer">
        <span id="header-loyalty-icon">🎁</span>
        <span id="header-loyalty-text">Club de Fidelización</span>
      </button>
    </div>
  </header>

  <!-- Viewport Principal (Landing Page Full-Width / App Móvil Adaptable) -->
  <main id="main-viewport" class="landing-viewport">

    <!-- Sub-encabezado de la App Móvil (solo visible dentro de Fidelización / Admin) -->
    <div id="mobile-app-subheader" class="hidden p-3.5 flex items-center justify-between border-b border-slate-100 sticky top-0 bg-white/95 backdrop-blur z-30 shadow-sm">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="goToHome()">
        <img src="/img/niji-logo.png" alt="NIJI Logo" class="w-10 h-10 object-contain logo-sticker drop-shadow-sm" />
        <div>
          <div class="flex items-center leading-none">
            <span class="brand-logo-title text-xl font-black">
              <span class="text-[#ff4d5a]">N</span><span class="text-[#ff7e29]">I</span><span class="text-[#f59e0b]">J</span><span class="text-[#0d9488]">I</span>
            </span>
            <span class="text-slate-800 text-xs font-black ml-1.5 uppercase tracking-wide">PERÚ</span>
          </div>
          <p class="text-[10px] text-slate-400 tracking-wider font-bold mt-0.5">CLUB DE BENEFICIOS</p>
        </div>
      </div>

      <div id="header-badge" class="text-right">
        <span id="role-badge" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-orange-100 text-orange-700 border border-orange-200">CLIENTE</span>
      </div>
    </div>

    <!-- Contenido Dinámico de la SPA -->
    <div id="app-view" class="flex-1 flex flex-col">
      <div class="flex flex-col items-center justify-center py-20 text-slate-400">
        <div class="w-8 h-8 border-2 border-orange-400 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-xs font-medium">Cargando NIJI Perú...</p>
      </div>
    </div>

  </main>

  <!-- Contenedor Flotante de Notificaciones Toast -->
  <div id="toast-container"></div>

  <!-- Scripts de la Aplicación -->
  <script src="/js/api.js?v=4.0"></script>
  <script src="/js/audio.js?v=4.0"></script>
  <script src="/js/confetti.js?v=4.0"></script>
  <script src="/js/roulette.js?v=4.0"></script>
  <script src="/js/app.js?v=4.0"></script>

  <!-- Registro y Actualización del Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=4.0')
          .then(reg => {
            reg.update();
            console.log('✅ ServiceWorker actualizado a v4.0:', reg.scope);
          })
          .catch(err => console.log('❌ Error ServiceWorker:', err));
      });
    }
  </script>
</body>
</html>
