<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#fff7ed">
  <meta name="description" content="App de Fidelización NIJI Perú - Tarjeta de Sellos Digitales y Ruleta Spin-to-Win">
  <title>NIJI Perú Club | Tarjeta de Sellos & Premios</title>
  
  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/img/niji-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="/img/niji-logo.png">

  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css?v=3.2">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            niji: {
              red: '#ff4d5a',
              'red-pastel': '#ffe4e6',
              orange: '#ff7e29',
              'orange-pastel': '#ffedd5',
              yellow: '#f59e0b',
              'yellow-pastel': '#fef3c7',
              teal: '#0d9488',
              'teal-pastel': '#ccfbf1',
              pink: '#f43f5e',
              'pink-pastel': '#ffe4e6',
              bg: '#f8fafc',
              surface: '#ffffff'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="mobile-frame-active">

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <!-- Barra de Utilidades Superior (Estilo Claro Pastel) -->
  <header class="w-full bg-white/90 backdrop-blur border-b border-slate-200/80 text-xs py-2 px-4 flex items-center justify-between z-50 shadow-sm">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2.5 h-2.5 rounded-full bg-orange-500 animate-ping"></span>
      <span class="brand-logo-title text-base font-black">
        <span class="text-[#ff4d5a]">N</span><span class="text-[#ff7e29]">I</span><span class="text-[#f59e0b]">J</span><span class="text-[#0d9488]">I</span>
      </span>
      <span class="font-black text-slate-800 tracking-wide text-xs">PERÚ</span>
      <span class="bg-orange-50 text-orange-600 border border-orange-200 px-2 py-0.5 rounded-full text-[10px] font-bold hidden sm:inline ml-1">PWA Oficial</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- Toggle de Simulador Móvil -->
      <button id="toggle-frame-btn" class="text-slate-600 hover:text-slate-900 flex items-center gap-1 transition px-2.5 py-1 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-semibold" title="Alternar marco de teléfono móvil">
        <span id="frame-btn-icon">📱</span>
        <span id="frame-btn-text" class="hidden sm:inline">Modo Móvil</span>
      </button>

      <!-- Switch Rápido de Portal -->
      <div id="nav-quick-links" class="flex items-center gap-2">
        <button onclick="navigateTo('#login')" class="text-slate-600 hover:text-orange-600 font-semibold hover:underline">Cliente</button>
        <span class="text-slate-300">|</span>
        <button onclick="navigateTo('#admin-login')" class="text-teal-700 hover:text-teal-800 font-bold hover:underline">Personal / Caja</button>
      </div>

      <!-- Usuario Logueado / Logout -->
      <div id="nav-user-info" class="hidden flex items-center gap-2 pl-2 border-l border-slate-200">
        <span id="nav-username" class="font-bold text-orange-600 text-xs"></span>
        <button onclick="logout()" class="text-slate-400 hover:text-rose-600 transition ml-1" title="Cerrar Sesión">
          <svg class="w-4 h-4 inline" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Viewport de la App (Responsive / Móvil) -->
  <main class="phone-viewport bg-white border-slate-200 shadow-xl overflow-y-auto">

    <!-- Encabezado de la App Móvil con Mascota Oficial -->
    <div class="p-3.5 flex items-center justify-between border-b border-slate-100 sticky top-0 bg-white/95 backdrop-blur z-30 shadow-sm">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="goToHome()">
        <img src="/img/niji-logo.png" alt="NIJI Logo" class="w-10 h-10 object-contain logo-sticker drop-shadow-sm" />
        <div>
          <div class="flex items-center leading-none">
            <span class="brand-logo-title text-xl font-black">
              <span class="text-[#ff4d5a]">N</span><span class="text-[#ff7e29]">I</span><span class="text-[#f59e0b]">J</span><span class="text-[#0d9488]">I</span>
            </span>
            <span class="text-slate-800 text-xs font-black ml-1.5 uppercase tracking-wide">PERÚ</span>
          </div>
          <p class="text-[10px] text-slate-400 tracking-wider font-bold mt-0.5">CLUB DE BENEFICIOS</p>
        </div>
      </div>

      <div id="header-badge" class="text-right">
        <span id="role-badge" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-orange-100 text-orange-700 border border-orange-200">CLIENTE</span>
      </div>
    </div>

    <!-- Contenido Dinámico de la SPA -->
    <div id="app-view" class="p-4 flex-1 flex flex-col justify-center">
      <div class="flex flex-col items-center justify-center py-12 text-slate-400">
        <div class="w-8 h-8 border-2 border-orange-400 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-xs font-medium">Cargando NIJI Perú...</p>
      </div>
    </div>

  </main>

  <!-- Contenedor Flotante de Notificaciones Toast -->
  <div id="toast-container"></div>

  <!-- Scripts de la Aplicación -->
  <script src="/js/api.js?v=3.2"></script>
  <script src="/js/audio.js?v=3.2"></script>
  <script src="/js/confetti.js?v=3.2"></script>
  <script src="/js/roulette.js?v=3.2"></script>
  <script src="/js/app.js?v=3.2"></script>

  <!-- Registro y Actualización del Service Worker para PWA -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=3.2')
          .then(reg => {
            reg.update();
            console.log('✅ ServiceWorker actualizado a v3.2:', reg.scope);
          })
          .catch(err => console.log('❌ Error ServiceWorker:', err));
      });
    }
  </script>
</body>
</html>
