<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="75%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#e11d48" stroke-width="4" opacity="0.3"/>
  <!-- Arcoíris estilizado Niji -->
  <path d="M 120 340 A 136 136 0 0 1 392 340" fill="none" stroke="url(#rainbowGrad)" stroke-width="26" stroke-linecap="round"/>
  <path d="M 152 340 A 104 104 0 0 1 360 340" fill="none" stroke="#f43f5e" stroke-width="20" stroke-linecap="round"/>
  <path d="M 184 340 A 72 72 0 0 1 328 340" fill="none" stroke="#fbbf24" stroke-width="16" stroke-linecap="round"/>
  
  <!-- Letras NIJI -->
  <text x="256" y="270" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">NIJI</text>
  <text x="256" y="310" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f43f5e" text-anchor="middle" letter-spacing="10">PERÚ</text>

  <!-- Estrella / Sello de lealtad -->
  <circle cx="256" cy="140" r="28" fill="#e11d48"/>
  <polygon points="256,120 262,134 278,136 266,147 270,162 256,154 242,162 246,147 234,136 250,134" fill="#fbbf24"/>
</svg>
